# Builds the distributable packages (engines + builder, no game code) on every push to main.
# The packages are available as workflow artifacts; release.yml publishes them.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LINUX_DEPS: >-
    build-essential cmake ninja-build git libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxss-dev libxinerama-dev libxfixes-dev libxkbcommon-dev libwayland-dev libegl-dev libdecor-0-dev
    libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libgl-dev zlib1g-dev

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
      - name: llvm-mingw
        run: |
          curl -sL -o lm.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf lm.tar.xz -C $HOME
      - name: Build package
        run: LLVM_MINGW=$HOME/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64 tools/package_windows.sh $PWD/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/StarWarsRacer-Recomp-win64.zip

  linux:
    # Ubuntu 22.04 = glibc 2.35 baseline: the binaries then run on SteamOS 3, Ubuntu 22.04+, Fedora, Arch...
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Build package
        run: tools/package_linux.sh $PWD/dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/StarWarsRacer-Recomp-linux-x64.tar.gz

  # SteamOS-like check: an Arch Linux system with no compiler and no development packages.
  # Both engines must start (all libraries found) and build_game.sh must build a module by itself.
  steamos:
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Runtime libraries only (what SteamOS ships)
        run: pacman -Syu --noconfirm --needed libpulse alsa-lib libglvnd systemd-libs zlib zstd libpng xz tar curl
      - name: Engine libraries resolve
        run: |
          tar -xzf StarWarsRacer-Recomp-linux-x64.tar.gz
          cd StarWarsRacer-Recomp
          ! command -v gcc && ! command -v cc && ! command -v make
          for e in swracer swracer-dc; do
            ldd ./$e | tee ldd.txt
            ! grep -q "not found" ldd.txt
            (SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 20 ./$e 2>&1 || true) | tee run.txt
            ! grep -q "error while loading shared libraries" run.txt
          done
      - name: Builder bootstraps its own compiler (Zig) and builds a module
        run: |
          tools/make_test_gen.sh StarWarsRacer-Recomp
          cd StarWarsRacer-Recomp
          SWR_NO_PAUSE=1 ./build_game.sh --compile-only
          ls -la libswr_game.so
          grep -q swr_module_init libswr_game.so
          ldd libswr_game.so
